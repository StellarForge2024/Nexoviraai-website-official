
name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to Cloudflare Pages

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck and Validate
        run: npm run lint

      - name: Build Static Production Assets
        run: npm run build

      - name: Check Cloudflare token availability
        shell: bash
        env:
          CF_TOKEN_CHECK: ${{ secrets.CF_PAGES_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN_CHECK" ]; then
            echo "Cloudflare token secret is available."
          else
            echo "::error::CF_PAGES_TOKEN is missing or unavailable."
            exit 1
          fi

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_PAGES_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=nexoviraai-website-official
